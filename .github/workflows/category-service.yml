name: category-service – CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'microservice-backend/category-service/**'
      - '.github/workflows/category-service.yml'
  pull_request:
    branches: [main]
    paths:
      - 'microservice-backend/category-service/**'
  workflow_dispatch:

env:
  SERVICE_NAME: category-service
  IMAGE_NAME: ${{ secrets.DOCKER_HUB_USERNAME }}/purely-category-service
  K8S_DEPLOYMENT: category-depl
  K8S_NAMESPACE: purely

jobs:
  # ── 1. Test ────────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run unit tests
        working-directory: microservice-backend/category-service
        run: mvn test --batch-mode

  # ── 2. Build & Push ────────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push
    runs-on: self-hosted
    needs: test
    if: github.event_name != 'pull_request'
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: microservice-backend/category-service
          file: microservice-backend/category-service/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ env.SERVICE_NAME }}
          cache-to: type=gha,mode=max,scope=${{ env.SERVICE_NAME }}

  # ── 3. Deploy to Kind ──────────────────────────────────────────────────────
  deploy:
    name: Deploy to Kind
    runs-on: self-hosted
    needs: build-and-push
    steps:
      - name: Pull & re-tag image for Kind
        run: |
          echo "${{ secrets.DOCKER_HUB_TOKEN }}" | \
            docker login -u "${{ secrets.DOCKER_HUB_USERNAME }}" --password-stdin
          docker pull "${{ env.IMAGE_NAME }}:latest"
          docker tag "${{ env.IMAGE_NAME }}:latest" "purely/${{ env.SERVICE_NAME }}:latest"

      - name: Load image into Kind cluster
        run: |
          CLUSTER="${{ secrets.KIND_CLUSTER_NAME }}"
          KIND_ARGS=""
          [ -n "$CLUSTER" ] && KIND_ARGS="--name $CLUSTER"
          kind load docker-image "purely/${{ env.SERVICE_NAME }}:latest" $KIND_ARGS

      - name: Rollout restart deployment
        run: |
          kubectl rollout restart deployment/${{ env.K8S_DEPLOYMENT }} \
            -n ${{ env.K8S_NAMESPACE }}

      - name: Wait for rollout to complete
        run: |
          kubectl rollout status deployment/${{ env.K8S_DEPLOYMENT }} \
            -n ${{ env.K8S_NAMESPACE }} \
            --timeout=180s

      - name: Show pod status
        run: kubectl get pods -n ${{ env.K8S_NAMESPACE }} -l app=category
