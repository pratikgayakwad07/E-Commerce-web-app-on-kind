# ── Test configuration for auth-service ──────────────────────────────────────
# Provides a valid MongoDB URI so Spring context loads in CI without env vars.
# Flapdoodle embedded MongoDB (added to pom.xml) handles the actual connection.
spring.data.mongodb.uri=mongodb://localhost:27017/purely_auth_service_test

# Disable Eureka registration during tests (no discovery server in CI)
eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

# Disable mail auto-config checks during tests
spring.mail.host=localhost
spring.mail.port=3025
